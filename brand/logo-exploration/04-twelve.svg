<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hercules Twelve logo</title>
  <desc id="desc">Twelve rhythmic marks surround a calm center, referencing consistency and the twelve labors.</desc>
  <defs>
    <rect id="twelve-ray-long" x="47" y="14" width="6" height="18" rx="3" fill="currentColor"/>
    <rect id="twelve-ray-short" x="47.5" y="17" width="5" height="13" rx="2.5" fill="currentColor"/>
  </defs>
  <g>
    <use href="#twelve-ray-long"/>
    <use href="#twelve-ray-short" transform="rotate(30 50 50)"/>
    <use href="#twelve-ray-long" transform="rotate(60 50 50)"/>
    <use href="#twelve-ray-short" transform="rotate(90 50 50)"/>
    <use href="#twelve-ray-long" transform="rotate(120 50 50)"/>
    <use href="#twelve-ray-short" transform="rotate(150 50 50)"/>
    <use href="#twelve-ray-long" transform="rotate(180 50 50)"/>
    <use href="#twelve-ray-short" transform="rotate(210 50 50)"/>
    <use href="#twelve-ray-long" transform="rotate(240 50 50)"/>
    <use href="#twelve-ray-short" transform="rotate(270 50 50)"/>
    <use href="#twelve-ray-long" transform="rotate(300 50 50)"/>
    <circle cx="41" cy="20.5" r="3.5" fill="currentColor"/>
  </g>
</svg>
